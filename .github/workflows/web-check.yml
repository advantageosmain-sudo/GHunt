name: Web check
on:
  push:
    paths: ['web/**', 'backend/**', 'Dockerfile', '.github/workflows/web-check.yml']
  pull_request:
    paths: ['web/**', 'backend/**', 'Dockerfile', '.github/workflows/web-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test web/test-worker.mjs
      - run: node web/build.mjs
      - run: node --check web/dist/server/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest backend.test_app -v
      - run: python -m compileall -q backend
      - run: docker build -t ghunt-backend-validation .
